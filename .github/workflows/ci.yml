name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run compile

      # ⛔ 这里不跑 `npm run package`：打包脚本 tools/build.mjs 是本机私有的（刻意
      #    不进公开仓库），CI 上必然失败。CI 只做通用可重复的三件事：lint / format /
      #    compile；正式打包走本地构建流程（构建内部会跑拆包体检 + 泄密扫描）。
